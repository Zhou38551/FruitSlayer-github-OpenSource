
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FruitSlayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary-color: #e94560;
            --text-color: #ffffff;
            --pixel-font: 'Press Start 2P', cursive;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { margin: 0; padding: 0; background: var(--bg-gradient); color: var(--text-color); font-family: var(--pixel-font); overflow: hidden; width: 100vw; height: 100vh; }
        #app-container { position: relative; width: 100%; height: 100%; }
        
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; image-rendering: pixelated; }

        /* UI Layer - 确保UI层不拦截Canvas点击，但子元素可点击 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            border: 1px solid var(--glass-border); 
            box-shadow: var(--glass-shadow); 
            border-radius: 12px; 
            padding: 10px 20px; 
            pointer-events: auto; /* 允许面板接收点击 */
        }
        
        #top-bar { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 20px; 
            min-width: 300px; 
            justify-content: space-around; 
        }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 8px; opacity: 0.7; margin-bottom: 4px; }

        /* Buttons - 显式启用指针事件并提高层级 */
        .glass-btn { 
            background: var(--glass-bg); 
            backdrop-filter: blur(4px); 
            border: 1px solid var(--glass-border); 
            color: white; 
            font-family: var(--pixel-font); 
            padding: 12px 20px; 
            margin: 8px 0; 
            cursor: pointer; 
            font-size: 10px; 
            width: 100%; 
            border-radius: 8px; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            pointer-events: auto; /* 确保按钮可点击 */
            position: relative;
            z-index: 20;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .glass-btn:active { transform: translateY(0); }
        .glass-btn.primary { background: rgba(233, 69, 96, 0.2); border-color: rgba(233, 69, 96, 0.5); }
        .glass-btn.small { padding: 5px 10px; font-size: 8px; width: auto; }

        .glass-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(5px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 30; /* 提高层级确保在最前 */
            pointer-events: auto; 
        }
        .hidden { display: none !important; }
        
        .glass-card { 
            background: rgba(20, 20, 35, 0.9); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 30px; 
            text-align: center; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            max-width: 90%; 
            width: 400px; 
            animation: fadeIn 0.3s ease-out; 
            max-height: 90vh; 
            overflow-y: auto; 
            pointer-events: auto;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .pixel-title { font-size: 24px; color: var(--primary-color); text-shadow: 2px 2px 0 #000, 0 0 10px var(--primary-color); margin-bottom: 10px; line-height: 1.4; }
        .disclaimer { font-size: 8px; color: #aaa; margin-bottom: 20px; font-family: sans-serif; }
        .highlight { color: #ffd700; }
        
        .lang-selector { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        .lang-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 5px 10px; font-size: 8px; cursor: pointer; border-radius: 4px; pointer-events: auto; }
        .lang-btn.active { background: var(--primary-color); border-color: var(--primary-color); }

        .setting-item { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; font-size: 10px; }
        
        /* Floating Text */
        .floating-text { position: absolute; font-family: var(--pixel-font); font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 1px 1px 0 #000; z-index: 15; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.1); opacity: 0; } }

        #settings-btn, #exit-game-btn { 
            position: absolute; 
            top: 20px; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            padding: 0; 
            font-size: 18px; 
            pointer-events: auto; 
            z-index: 25; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        #settings-btn { right: 20px; }
        #settings-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        #exit-game-btn { 
            left: 20px; 
            background: rgba(233, 69, 96, 0.25); 
            border-color: rgba(233, 69, 96, 0.5);
            display: none;
        }
        #exit-game-btn:hover { background: rgba(233, 69, 96, 0.5); transform: scale(1.1); }
        #exit-game-btn::after {
            content: attr(title);
            position: absolute;
            left: 50%;
            top: 110%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-family: var(--pixel-font);
        }
        #exit-game-btn:hover::after { opacity: 1; }

        /* License Modal */
        .license-text { font-family: sans-serif; font-size: 12px; text-align: left; line-height: 1.6; color: #ddd; white-space: pre-wrap; margin: 20px 0; max-height: 300px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); padding: 10px; background: rgba(0,0,0,0.3); }
        .version-badge { display: inline-block; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 4px; font-size: 8px; margin-top: 5px; }
        
        /* Exit Confirm Modal text */
        #exit-confirm-modal p { white-space: pre-line; }
    </style>
</head>
<body>
    <div id="app-container">
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <header id="top-bar" class="glass-panel">
                <div class="stat-box"><span class="label" data-i18n="score">SCORE</span><span id="score-display">0</span></div>
                <div class="stat-box"><span class="label" data-i18n="lives">LIVES</span><span id="lives-display">❤❤❤</span></div>
                <div class="stat-box"><span class="label" data-i18n="combo">COMBO</span><span id="combo-display">x1</span></div>
            </header>

            <button id="exit-game-btn" class="glass-btn" title="Exit Game">🚪</button>
            <button id="settings-btn" class="glass-btn">⚙️</button>
        </div>

        <!-- Main Menu -->
        <div id="menu-overlay" class="glass-overlay">
            <div class="glass-card main-menu">
                <h1 class="pixel-title" data-text="FRUIT SLAYER">FRUIT SLAYER</h1>
                <div class="version-badge" id="version-display">GitHub开源版</div>
                <p class="disclaimer" data-i18n="disclaimer">爱好者创作 · 与 Fruit Ninja 无关</p>
                
                <div id="nickname-section">
                    <p><span data-i18n="welcome">欢迎</span>, <span id="player-nickname" class="highlight">Player</span></p>
                    <button id="edit-nickname-btn" class="glass-btn small" data-i18n="editName">修改昵称</button>
                </div>

                <div class="menu-buttons">
                    <button class="glass-btn primary" data-mode="free" data-i18n="freeMode">自由模式</button>
                    <button class="glass-btn" data-mode="campaign" data-i18n="campaignMode">闯关模式</button>
                    <button class="glass-btn" id="show-license-btn" data-i18n="viewLicense">查看许可证</button>
                </div>

                <div class="lang-selector">
                    <button class="lang-btn" data-lang="zh-CN">简中</button>
                    <button class="lang-btn" data-lang="zh-TW">繁中</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="glass-overlay hidden">
            <div class="glass-card">
                <h2 data-i18n="settings">设置</h2>
                <div class="setting-item">
                    <label data-i18n="particleEffect">粒子效果</label>
                    <input type="checkbox" id="toggle-particles" checked style="pointer-events: auto;">
                </div>
                <div class="setting-item">
                    <label data-i18n="sound">音效</label>
                    <input type="checkbox" id="toggle-sound" checked style="pointer-events: auto;">
                </div>
                <button class="glass-btn" id="close-settings" data-i18n="close">关闭</button>
            </div>
        </div>

        <!-- License Modal -->
        <div id="license-modal" class="glass-overlay hidden">
            <div class="glass-card">
                <h2 data-i18n="licenseTitle">软件许可协议</h2>
                <div id="license-content" class="license-text">加载中...</div>
                <button class="glass-btn" id="close-license" data-i18n="close">关闭</button>
            </div>
        </div>

        <!-- Pause/Game Over Overlay -->
        <div id="pause-overlay" class="glass-overlay hidden">
            <div class="glass-card">
                <h2 id="pause-title" data-i18n="gameOver">游戏结束</h2>
                <p><span data-i18n="finalScore">最终得分</span>: <span id="final-score">0</span></p>
                <button class="glass-btn primary" id="restart-btn" data-i18n="retry">再试一次</button>
                <button class="glass-btn" id="home-btn" data-i18n="home">返回主页</button>
                <button class="glass-btn" id="pause-exit-btn" style="display:none;" data-i18n="exitToMenu">退出游戏</button>
            </div>
        </div>

        <!-- Exit Confirmation Modal -->
        <div id="exit-confirm-modal" class="glass-overlay hidden">
            <div class="glass-card">
                <h2 data-i18n="exitTitle">退出游戏</h2>
                <p data-i18n="exitConfirm" style="font-size:10px; margin:15px 0; line-height:1.6;">确定要退出当前游戏返回主菜单吗？</p>
                <p style="font-size:8px; color:#aaa; margin-bottom:15px;" id="exit-score-info"></p>
                <button class="glass-btn primary" id="exit-confirm-yes" data-i18n="confirmExit">确认退出</button>
                <button class="glass-btn" id="exit-confirm-no" data-i18n="continueGame">继续游戏</button>
            </div>
        </div>
        
        <div id="floating-text-container"></div>
    </div>

    <script src="i18n.js"></script>
    <script src="game.js"></script>
</body>
</html>
